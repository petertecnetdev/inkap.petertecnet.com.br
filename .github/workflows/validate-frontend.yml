name: Validate Inkap frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ecosystem-visual-analytics]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/utils/installInkapInsights.js src/index.js src/components/PeterAccountGateway.js
      - run: npm run build
        env:
          CI: true
